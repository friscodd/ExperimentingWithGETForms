<!doctype html>

<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GET Form Experiment</title>
  </head>

  <body>
    <h1>GET Form Experiment</h1>
    <p>This form demonstrates browser behavior; it does not send a real message.</p>

    <form action="" method="get">

        <p>
        <label for="visitor-name">Your name</label>
        <input id="visitor-name" name="visitorName" type="text" required>
        </p>

        <p>
        <label for="visitor-message">Message</label>
        <textarea id="visitor-message" name="message" rows="4"></textarea>
        </p>

        <button type="submit">Show values in the URL</button>
        
    </form>

  </body>
</html>
